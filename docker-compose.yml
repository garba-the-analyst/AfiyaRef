services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: afiyaref-postgres
    environment:
      POSTGRES_USER: afiyaref
      POSTGRES_PASSWORD: afiyaref
      POSTGRES_DB: afiyaref
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: afiyaref-redis
    ports:
      - "6380:6379"
volumes:
  pgdata:
