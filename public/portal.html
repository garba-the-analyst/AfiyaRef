<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AfiyaRef Facility Portal</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 16px; background: #f6f8fa; }
  h1 { font-size: 22px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  input, select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #0066cc; color: #fff; cursor: pointer; }
  button.ack { background: #1a7f37; }
  button.rej { background: #b42318; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .meta { color: #555; font-size: 13px; }
  .status { font-weight: bold; }
  pre { background: #f0f0f0; padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<h1>AfiyaRef Facility Portal 🏥</h1>
<div class="bar">
  <input id="key" type="password" placeholder="Admin key (x-admin-key)" size="30" />
  <select id="status">
    <option value="">All statuses</option>
    <option value="NOTIFIED" selected>NOTIFIED</option>
    <option value="ACKNOWLEDGED">ACKNOWLEDGED</option>
    <option value="REJECTED">REJECTED</option>
  </select>
  <button onclick="load()">Load transfers</button>
</div>
<div id="list"></div>

<script>
async function load() {
  const key = document.getElementById('key').value;
  const status = document.getElementById('status').value;
  const q = status ? `?status=${status}` : '';
  const res = await fetch(`/api/admin/transfers/incoming${q}`, { headers: { 'x-admin-key': key } });
  const data = await res.json();
  const list = document.getElementById('list');
  if (!res.ok) { list.innerHTML = `<p style="color:red">${data.error || res.status}</p>`; return; }
  if (!data.length) { list.innerHTML = '<p>No transfers.</p>'; return; }
  list.innerHTML = data.map(t => `
    <div class="card">
      <div><span class="status">${t.status}</span> • ${t.id.slice(0, 8)} • ${new Date(t.createdAt).toLocaleString()}</div>
      <div class="meta">Patient: ${t.user?.fullName} (${t.user?.phoneNumber}) • NHIA: ${t.nhiaNumberUsed || '—'}</div>
      <div class="meta">Treating: ${t.treatingFacility?.name} • Home: ${t.homeFacility?.name || '—'}</div>
      <details><summary>EHR snapshot</summary><pre>${JSON.stringify(t.payload?.ehr_snapshot || {}, null, 1)}</pre></details>
      <div class="bar" style="margin-top:8px">
        <button class="ack" onclick="decide('${t.id}', 'ACKNOWLEDGED')">Acknowledge</button>
        <button class="rej" onclick="decide('${t.id}', 'REJECTED')">Reject</button>
      </div>
    </div>`).join('');
}

async function decide(id, status) {
  const key = document.getElementById('key').value;
  const res = await fetch(`/api/admin/transfers/${id}/status`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
    body: JSON.stringify({ status }),
  });
  if (!res.ok) alert('Failed: ' + res.status);
  load();
}
</script>
</body>
</html>
